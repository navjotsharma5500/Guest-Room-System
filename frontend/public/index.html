<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- ✅ Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- ✅ App Icons -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/Thapar_Logo.png" />

    <!-- ✅ Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- ✅ Theme Color -->
    <meta name="theme-color" content="#000000" />

    <!-- ✅ SEO Description -->
    <meta
      name="description"
      content="One Platform. Every Student Need. Seamlessly Connected."
    />

    <!-- ✅ Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- ✅ Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z8GK8ESCM1"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-Z8GK8ESCM1');
    </script>

    <!-- ✅ Title -->
    <title>Thapar Campus Connect</title>

    <!-- ✅ Optional: Preload Logo (faster rendering) -->
    <link rel="preload" as="image" href="%PUBLIC_URL%/Thapar_Logo.png" />
    
    <!-- ✅ Preloader Styling -->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background-color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }

      #preloader {
        position: fixed;
        inset: 0;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 24px;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      .preloader-content {
        display: flex;
        width: 100%;
        max-width: 360px;
        flex-direction: column;
        align-items: center;
        text-align: center;
        animation: preloader-appear 500ms ease-out both;
      }

      .preloader-logo {
        width: clamp(96px, 28vw, 132px);
        height: auto;
        margin-bottom: 24px;
      }

      #preloader h1 {
        margin: 0;
        color: #1d1d1f;
        font-size: clamp(1.35rem, 5vw, 1.75rem);
        font-weight: 600;
        line-height: 1.25;
        letter-spacing: -0.025em;
      }

      #preloader p {
        margin: 10px 0 0;
        color: #6e6e73;
        font-size: 0.95rem;
        line-height: 1.5;
      }

      .preloader-spinner {
        width: 24px;
        height: 24px;
        margin-top: 24px;
        border: 2px solid #e5e5e7;
        border-top-color: #4b4b4f;
        border-radius: 50%;
        animation: preloader-spin 800ms linear infinite;
      }

      @keyframes preloader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes preloader-appear {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .preloader-content {
          animation: none;
        }

        .preloader-spinner {
          animation-duration: 1.5s;
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- ✅ Preloader with Logo -->
    <div id="preloader" role="status" aria-live="polite" aria-label="Loading TIET Campus Connect">
      <div class="preloader-content">
        <img
          class="preloader-logo"
          src="%PUBLIC_URL%/Thapar_Logo.png"
          alt="TIET Campus Connect"
        />
        <h1>TIET Campus Connect</h1>
        <p>Connecting Campus...</p>
        <div class="preloader-spinner" aria-hidden="true"></div>
      </div>
    </div>

    <!-- ✅ React Root -->
    <div id="root"></div>

    <!-- ✅ Remove Preloader After Load -->
    <script>
      window.addEventListener("load", function () {
        const loader = document.getElementById("preloader");
        if (loader) loader.style.display = "none";
      });
    </script>
  </body>
</html>
